<title id="t">DMARC enforcement by mail platform, Vaughan business domains, October 2026</title><desc id="d">IT Rapid Support study, 4 October 2026: Microsoft 365 domains 29.5% enforce DMARC, other hosts 16.4%, Google Workspace 7.5%.</desc>
<rect width="800" height="312" rx="18" fill="#f8fafc"/>
<g font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><text x="40" y="50" font-size="20" font-weight="700" fill="#0f172a">Vaughan domains enforcing DMARC, by mail platform</text><text x="40" y="88" font-size="15" font-weight="600" fill="#0f172a">Microsoft 365 (88 domains)</text><rect x="40" y="96" width="520" height="26" rx="6" fill="#e2e8f0"/><rect x="40" y="96" width="153" height="26" rx="6" fill="#475569"/><text x="574" y="115" font-size="16" font-weight="700" fill="#0f172a">29.5%</text><text x="640" y="115" font-size="13" fill="#64748b">enforce</text><text x="40" y="150" font-size="15" font-weight="600" fill="#0f172a">Other mail hosts (122 domains)</text><rect x="40" y="158" width="520" height="26" rx="6" fill="#e2e8f0"/><rect x="40" y="158" width="85" height="26" rx="6" fill="#475569"/><text x="574" y="177" font-size="16" font-weight="700" fill="#0f172a">16.4%</text><text x="640" y="177" font-size="13" fill="#64748b">enforce</text><text x="40" y="212" font-size="15" font-weight="600" fill="#0f172a">Google Workspace (80 domains)</text><rect x="40" y="220" width="520" height="26" rx="6" fill="#e2e8f0"/><rect x="40" y="220" width="39" height="26" rx="6" fill="#dc2626"/><text x="574" y="239" font-size="16" font-weight="700" fill="#0f172a">7.5%</text><text x="640" y="239" font-size="13" fill="#64748b">enforce</text><text x="40" y="294" font-size="12" fill="#64748b">Source: IT Rapid Support Vaughan Business Email Security Study, public DNS checks on 4 October 2026</text></g></svg>