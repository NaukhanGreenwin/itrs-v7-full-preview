<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 312" width="800" height="312" role="img" aria-labelledby="t d">
<title id="t">Email authentication across 290 Vaughan business domains, October 2026</title><desc id="d">IT Rapid Support study, 4 October 2026: 89.0% publish SPF, 51.4% publish DMARC, 17.9% enforce DMARC.</desc>
<rect width="800" height="312" rx="18" fill="#f8fafc"/>
<g font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><text x="40" y="50" font-size="20" font-weight="700" fill="#0f172a">Vaughan business domains: email spoofing protection</text><text x="40" y="88" font-size="15" font-weight="600" fill="#0f172a">Publish an SPF record</text><rect x="40" y="96" width="520" height="26" rx="6" fill="#e2e8f0"/><rect x="40" y="96" width="462" height="26" rx="6" fill="#475569"/><text x="574" y="115" font-size="16" font-weight="700" fill="#0f172a">89.0%</text><text x="640" y="115" font-size="13" fill="#64748b">258 of 290</text><text x="40" y="150" font-size="15" font-weight="600" fill="#0f172a">Publish a DMARC record</text><rect x="40" y="158" width="520" height="26" rx="6" fill="#e2e8f0"/><rect x="40" y="158" width="267" height="26" rx="6" fill="#475569"/><text x="574" y="177" font-size="16" font-weight="700" fill="#0f172a">51.4%</text><text x="640" y="177" font-size="13" fill="#64748b">149 of 290</text><text x="40" y="212" font-size="15" font-weight="600" fill="#0f172a">Enforce DMARC (quarantine or reject)</text><rect x="40" y="220" width="520" height="26" rx="6" fill="#e2e8f0"/><rect x="40" y="220" width="93" height="26" rx="6" fill="#dc2626"/><text x="574" y="239" font-size="16" font-weight="700" fill="#0f172a">17.9%</text><text x="640" y="239" font-size="13" fill="#64748b">52 of 290</text><text x="40" y="294" font-size="12" fill="#64748b">Source: IT Rapid Support Vaughan Business Email Security Study, public DNS checks on 4 October 2026</text></g></svg>