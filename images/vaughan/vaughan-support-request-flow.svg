<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" width="800" height="280" role="img" aria-labelledby="t d">
<title id="t">How an IT support request from a Vaughan business is handled</title>
<desc id="d">Four steps: you call, email or chat at any hour; the ticket is logged and triaged; most issues are fixed remotely on the call; hardware faults get an on-site visit from the Keele Street office.</desc>
<rect width="800" height="280" rx="18" fill="#f8fafc"/>
<g font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><text x="30" y="56" font-size="20" font-weight="700" fill="#0f172a">How a Vaughan IT support request is handled</text><rect x="30" y="90" width="170" height="150" rx="14" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><circle cx="60" cy="122" r="17" fill="#dc2626"/><text x="60" y="128" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">1</text><text x="46" y="170" font-size="16" font-weight="700" fill="#0f172a">You call,</text><text x="46" y="190" font-size="16" font-weight="700" fill="#0f172a">email or chat</text><text x="46" y="220" font-size="12" fill="#64748b">(289) 582-9930, 24/7</text><path d="M204 165 l14 0 m-6 -6 l6 6 l-6 6" stroke="#dc2626" stroke-width="3" fill="none" stroke-linecap="round"/><rect x="222" y="90" width="170" height="150" rx="14" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><circle cx="252" cy="122" r="17" fill="#dc2626"/><text x="252" y="128" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">2</text><text x="238" y="170" font-size="16" font-weight="700" fill="#0f172a">Ticket logged</text><text x="238" y="190" font-size="16" font-weight="700" fill="#0f172a">and triaged</text><text x="238" y="220" font-size="12" fill="#64748b">set by business impact</text><path d="M396 165 l14 0 m-6 -6 l6 6 l-6 6" stroke="#dc2626" stroke-width="3" fill="none" stroke-linecap="round"/><rect x="414" y="90" width="170" height="150" rx="14" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><circle cx="444" cy="122" r="17" fill="#dc2626"/><text x="444" y="128" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">3</text><text x="430" y="170" font-size="16" font-weight="700" fill="#0f172a">Fixed remotely</text><text x="430" y="190" font-size="16" font-weight="700" fill="#0f172a">first</text><text x="430" y="220" font-size="12" fill="#64748b">most solved on the call</text><path d="M588 165 l14 0 m-6 -6 l6 6 l-6 6" stroke="#dc2626" stroke-width="3" fill="none" stroke-linecap="round"/><rect x="606" y="90" width="170" height="150" rx="14" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><circle cx="636" cy="122" r="17" fill="#dc2626"/><text x="636" y="128" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">4</text><text x="622" y="170" font-size="16" font-weight="700" fill="#0f172a">On-site if</text><text x="622" y="190" font-size="16" font-weight="700" fill="#0f172a">hardware</text><text x="622" y="220" font-size="12" fill="#64748b">technician from Keele St</text></g></svg>